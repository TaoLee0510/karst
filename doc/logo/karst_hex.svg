<svg xmlns="http://www.w3.org/2000/svg" width="520" height="600" viewBox="0 0 520 600" role="img" aria-labelledby="t d">
<title id="t">KARST</title>
<desc id="d">Tower-karst peaks over water at dusk. The peaks are the fitness landscape; the sparse bars below the waterline, its broken reflection, are the observed karyotype abundances it is reconstructed from.</desc>
